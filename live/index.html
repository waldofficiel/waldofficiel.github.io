<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WALD OFF Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Habillage live WALD OFF : canevas portrait 1080x1920, fond transparent (source « Lien » dans TikTok LIVE Studio).
   Zones : caméra en haut (cadre néon), bandeau défi, Fortnite au milieu, menu des défis + photos en bas, calque effets par-dessus. */
:root{
  --bg:#0a0d1f; --bg2:#121735; --line:#2a3166;
  --fg:#f2f3ff; --mute:#9aa0cc;
  --hazard:#ffd60a; --cyan:#3de0ff; --live:#ff3b5c;
  --display:"Bungee","Impact",sans-serif;
  --body:"Chakra Petch",system-ui,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{font-family:var(--body);color:var(--fg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:var(--fit) translate(-14px,6px)}40%{transform:var(--fit) translate(12px,-8px)}60%{transform:var(--fit) translate(-8px,4px)}80%{transform:var(--fit) translate(6px,-2px)}}

/* Mode guide / aperçu : zones repérées pour caler la caméra et le jeu */
.guide #stage{background:#05060f}
.slot{position:absolute;display:none;place-items:center;font-family:var(--display);font-size:46px;color:rgba(255,255,255,.35);text-align:center}
.guide .slot{display:grid}
.slot.cam{left:40px;top:120px;width:1000px;height:480px;background:linear-gradient(135deg,#1b2350,#0e1330)}
.slot.game{left:0;top:718px;width:1080px;height:864px;background:linear-gradient(160deg,#1d6b8f,#3d9a5a 55%,#8a6a3a)}
.slot small{display:block;font-family:var(--body);font-size:26px;letter-spacing:.04em}

/* ---------- CADRE CAMÉRA ---------- */
.cam{position:absolute;left:40px;top:120px;width:1000px;height:480px;border-radius:30px;
  border:6px solid var(--cyan);box-sizing:border-box;
  box-shadow:0 0 18px var(--cyan),0 0 54px rgba(61,224,255,.45),inset 0 0 26px rgba(61,224,255,.45);
  animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{border-color:#7ef0ff;box-shadow:0 0 26px var(--cyan),0 0 80px rgba(61,224,255,.6),inset 0 0 34px rgba(61,224,255,.55)}}
.cam.hot{animation:hot .35s steps(2) infinite;border-color:var(--live)}
@keyframes hot{50%{border-color:var(--hazard);box-shadow:0 0 30px var(--hazard),0 0 90px rgba(255,59,92,.8),inset 0 0 40px rgba(255,214,10,.6)}}
.corner{position:absolute;width:86px;height:86px;border:0 solid var(--hazard);filter:drop-shadow(0 0 10px rgba(255,214,10,.8))}
.corner.tl{left:-20px;top:-20px;border-left-width:12px;border-top-width:12px;border-top-left-radius:34px}
.corner.tr{right:-20px;top:-20px;border-right-width:12px;border-top-width:12px;border-top-right-radius:34px}
.corner.bl{left:-20px;bottom:-20px;border-left-width:12px;border-bottom-width:12px;border-bottom-left-radius:34px}
.corner.br{right:-20px;bottom:-20px;border-right-width:12px;border-bottom-width:12px;border-bottom-right-radius:34px}
.tag{position:absolute;left:58px;top:-34px;transform:skewX(-8deg);font-family:var(--display);font-size:34px;line-height:1;
  color:#111;background:repeating-linear-gradient(-45deg,var(--hazard) 0 16px,#111 16px 32px);padding:6px 10px;box-shadow:6px 6px 0 var(--live)}
.tag span{display:inline-flex;align-items:center;gap:12px;background:var(--hazard);padding:6px 14px}
.tag i{width:18px;height:18px;border-radius:50%;background:var(--live);box-shadow:0 0 12px var(--live);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.handle{position:absolute;right:26px;bottom:20px;font-weight:700;font-size:28px;letter-spacing:.03em;padding:6px 16px;border-radius:999px;
  background:rgba(10,13,31,.72);border:2px solid rgba(61,224,255,.6);color:var(--fg)}

/* Compteur TOP 1 */
.top1{position:absolute;right:44px;top:-46px;display:flex;align-items:center;gap:14px;padding:8px 22px 8px 16px;border-radius:18px;
  background:linear-gradient(180deg,#1a1f45,#0a0d1f);border:4px solid var(--hazard);
  box-shadow:0 0 22px rgba(255,214,10,.55),6px 6px 0 var(--live)}
.top1 .crown{font-size:44px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,214,10,.9))}
.top1 .lbl{font-family:var(--display);font-size:22px;line-height:1;color:var(--mute)}
.top1 .num{font-family:var(--display);font-size:64px;line-height:.9;color:var(--hazard);text-shadow:3px 3px 0 var(--live),0 0 18px rgba(255,214,10,.7)}
.top1.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.45) rotate(-6deg)}100%{transform:scale(1)}}

/* Toasts cadeaux */
.toasts{position:absolute;left:0;right:0;top:490px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{font-weight:700;font-size:30px;padding:8px 22px;border-radius:14px;background:rgba(10,13,31,.88);border:3px solid var(--cyan);
  box-shadow:0 0 18px rgba(61,224,255,.55);white-space:nowrap;max-width:960px;overflow:hidden;text-overflow:ellipsis;
  animation:tin .35s cubic-bezier(.2,1.4,.4,1) both}
.toast b{color:var(--hazard)}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{transform:translateY(30px) scale(.6);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}

/* ---------- BANDEAU DÉFI ---------- */
.banner{position:absolute;left:0;top:616px;width:1080px;height:92px;overflow:hidden;
  background:repeating-linear-gradient(-45deg,var(--hazard) 0 26px,#111 26px 52px);background-size:200% 100%;
  box-shadow:0 6px 0 rgba(0,0,0,.5);animation:roll 6s linear infinite}
@keyframes roll{to{background-position:-147px 0}}
.banner .lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:1000px;box-sizing:border-box;
  display:flex;align-items:center;gap:18px;padding:10px 26px;background:#0a0d1f;border:3px solid #111;white-space:nowrap}
.banner .txt{font-family:var(--display);font-size:38px;line-height:1;color:var(--hazard);text-shadow:2px 2px 0 var(--live)}
.banner .txt.swap{animation:swap .45s ease both}
@keyframes swap{from{transform:translateY(40px);opacity:0}}
.banner .tm{display:none;font-family:var(--display);font-size:34px;line-height:1;color:#111;background:var(--hazard);padding:6px 12px;border-radius:8px}
.banner .q{display:none;font-weight:700;font-size:22px;color:var(--mute)}
.banner .bar{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.banner.on{background:repeating-linear-gradient(-45deg,var(--live) 0 26px,#111 26px 52px);background-size:200% 100%;animation:roll 1.2s linear infinite}
.banner.on .lab{border-color:var(--live);box-shadow:0 0 24px rgba(255,59,92,.8)}
.banner.on .txt{color:#fff;text-shadow:0 0 14px var(--live),2px 2px 0 var(--live)}
.banner.on .tm,.banner.on .q.has{display:block}
.who{position:absolute;left:50%;top:716px;transform:translateX(-50%);font-weight:700;font-size:24px;padding:4px 16px;border-radius:0 0 12px 12px;
  background:var(--live);color:#fff;white-space:nowrap;opacity:0;transition:opacity .3s}
.who.on{opacity:1}

/* ---------- ZONE JEU ---------- */
.game{position:absolute;left:0;top:718px;width:1080px;height:864px;box-sizing:border-box;
  border-top:4px solid var(--cyan);border-bottom:4px solid var(--cyan);
  box-shadow:0 -6px 22px rgba(61,224,255,.35),0 6px 22px rgba(61,224,255,.35)}
.game::before,.game::after{content:"";position:absolute;width:120px;height:14px;background:var(--hazard);box-shadow:0 0 14px rgba(255,214,10,.8)}
.game::before{left:0;bottom:-9px}
.game::after{right:0;bottom:-9px}

/* ---------- MENU DES DÉFIS ---------- */
.menu{position:absolute;left:24px;top:1600px;width:770px;padding:12px 16px 10px;box-sizing:border-box;border-radius:22px;
  background:linear-gradient(170deg,rgba(18,23,53,.94),rgba(10,13,31,.94));border:3px solid var(--hazard);box-shadow:8px 8px 0 var(--live)}
.menu h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:38px;line-height:1;color:var(--fg);text-shadow:3px 3px 0 var(--live)}
.menu h2 em{font-style:normal;color:var(--hazard)}
.row{display:flex;align-items:center;gap:14px;padding:2px 10px;border-radius:12px;transition:background .3s}
.row + .row{margin-top:4px}
.coin{flex:0 0 108px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:26px;color:var(--hazard)}
.coin i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc400 45%,#c98a00);box-shadow:0 0 8px rgba(255,196,0,.8)}
.row span{font-weight:700;font-size:23px;line-height:1.15;color:var(--fg)}
.row.lit{background:var(--live);box-shadow:0 0 20px rgba(255,59,92,.7)}
.row.lit .coin{color:#fff}

/* ---------- PHOTOS ---------- */
.pola{position:absolute;left:816px;top:1598px;width:240px;padding:10px 10px 10px;box-sizing:border-box;background:#f4f1e8;border-radius:6px;
  transform:rotate(3deg);box-shadow:0 0 0 3px var(--cyan),0 0 28px rgba(61,224,255,.55),10px 10px 0 rgba(0,0,0,.45)}
.pola::before{content:"";position:absolute;left:50%;top:-16px;width:120px;height:32px;transform:translateX(-50%) rotate(-4deg);
  background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#111 10px 20px);opacity:.92}
.pola .ph{width:220px;height:196px;overflow:hidden;background:#111}
.pola img{width:100%;height:100%;object-fit:cover;display:block}
.pola img.in{animation:pin .6s ease both}
@keyframes pin{from{opacity:0;transform:scale(1.15)}}
.pola p{margin:6px 0 0;font-family:var(--display);font-size:18px;line-height:1.05;color:#111;text-align:center}
.pola small{display:block;margin-top:2px;font-family:var(--body);font-weight:700;font-size:14px;color:#c4002b}

/* ---------- GROS CADEAU : Polo + texte chromé ---------- */
#fx{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.polo{position:absolute;left:0;top:927px;width:560px;height:255px;transform:translateX(-640px);filter:drop-shadow(0 10px 10px rgba(0,0,0,.6));pointer-events:none}
.big{position:absolute;left:40px;right:40px;top:1067px;text-align:center;pointer-events:none;opacity:0}
.big .t1{font-family:var(--display);font-size:92px;line-height:.95;
  background:linear-gradient(180deg,#ffffff 0%,#c9d2e6 38%,#6c7894 52%,#e9eefa 64%,#9aa6c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(61,224,255,.95)) drop-shadow(0 0 28px rgba(255,59,92,.8)) drop-shadow(4px 4px 0 #0a0d1f)}
.big .t2{display:inline-block;margin-top:14px;font-family:var(--display);font-size:40px;line-height:1.05;color:#111;background:var(--hazard);padding:10px 22px;
  border-radius:10px;box-shadow:0 0 30px rgba(255,214,10,.9),6px 6px 0 var(--live);max-width:1000px}
.big.on{animation:bigin 3.6s ease forwards}
@keyframes bigin{0%{opacity:0;transform:scale(2.4)}10%{opacity:1;transform:scale(.92)}16%{transform:scale(1.04)}22%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}

.dbg{position:absolute;left:12px;bottom:12px;font:600 20px/1.2 var(--body);background:rgba(0,0,0,.7);padding:6px 10px;border-radius:8px;display:none}
.debug .dbg{display:block}

/* ===================== THÈME 80's (synthwave) — par défaut. ?theme=classic pour l'ancien look ===================== */
body.t80{--pink:#ff2bd6;--violet:#9b4dff;--cyan:#2de2ff;--sun1:#ffd23f;--sun2:#ff5e7e;--sun3:#ff8a3d;--night:#12052b}
.t80 .chrome{background:linear-gradient(180deg,#ffffff 0%,#ffe1fb 30%,#b98cff 50%,#3a1a6b 52%,#ff8ad8 70%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(255,43,214,.9)) drop-shadow(0 0 18px rgba(45,226,255,.55)) drop-shadow(3px 3px 0 #12052b)}
/* cadre caméra : néon dégradé rose → violet → cyan */
.t80 .cam{border:0;border-radius:34px;background:none;
  box-shadow:0 0 22px rgba(255,43,214,.75),0 0 60px rgba(155,77,255,.45),0 0 26px rgba(45,226,255,.5) inset;animation:glow80 3s ease-in-out infinite}
@keyframes glow80{50%{box-shadow:0 0 30px rgba(45,226,255,.85),0 0 80px rgba(255,43,214,.5),0 0 34px rgba(255,43,214,.45) inset}}
.t80 .cam::before{content:"";position:absolute;inset:0;border-radius:34px;padding:7px;background:linear-gradient(120deg,var(--pink),var(--violet) 45%,var(--cyan));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.t80 .cam.hot::before{background:linear-gradient(120deg,var(--sun1),var(--sun3),var(--pink))}
.t80 .cam.hot{animation:hot80 .4s steps(2) infinite}
@keyframes hot80{50%{box-shadow:0 0 40px var(--sun3),0 0 90px var(--pink),0 0 40px rgba(255,210,63,.6) inset}}
.t80 .corner{display:none}
.t80 .tag{top:-52px;left:40px;transform:none;background:none;box-shadow:none;padding:0;font-size:58px;letter-spacing:.02em}
.t80 .tag span{background:none;padding:0;gap:14px}
.t80 .tag i{width:16px;height:16px;background:var(--pink);box-shadow:0 0 14px var(--pink)}
.t80 .top1{top:-50px;border:3px solid var(--pink);background:linear-gradient(180deg,rgba(43,10,80,.92),rgba(18,5,43,.92));box-shadow:0 0 22px rgba(255,43,214,.7),0 0 0 2px rgba(45,226,255,.35) inset}
.t80 .top1 .lbl{color:#ffb3f0}
.t80 .top1 .num{color:var(--sun1);text-shadow:0 0 14px rgba(255,138,61,.9),3px 3px 0 var(--pink)}
/* palmiers autour de la cam */
.palm{position:absolute;pointer-events:none;display:none;filter:drop-shadow(0 0 6px rgba(255,43,214,.85)) drop-shadow(0 0 16px rgba(155,77,255,.6))}
.t80 .palm{display:block}
.palm.l{left:-46px;bottom:-34px;width:190px;height:260px}
.palm.r{right:-46px;bottom:-34px;width:190px;height:260px;transform:scaleX(-1)}
.sun{position:absolute;display:none;pointer-events:none}
/* bandeau : bande violette avec lignes néon */
.t80 .banner{background:linear-gradient(90deg,#1a0636,#4b137a 30%,#7a1fa8 50%,#4b137a 70%,#1a0636);background-size:100% 100%;animation:none;
  box-shadow:0 -3px 0 var(--pink),0 3px 0 var(--cyan),0 0 26px rgba(255,43,214,.5)}
.t80 .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);background-size:300% 100%;animation:sweep 4s linear infinite}
@keyframes sweep{from{background-position:150% 0}to{background-position:-150% 0}}
.t80 .banner .lab{background:none;border:0;box-shadow:none}
.t80 .banner .txt{color:var(--sun1);text-shadow:0 0 10px rgba(255,138,61,.9),0 0 22px rgba(255,43,214,.7),3px 3px 0 #12052b}
.t80 .banner .tm{background:var(--cyan);color:#12052b;box-shadow:0 0 14px var(--cyan)}
.t80 .banner .bar{background:linear-gradient(90deg,var(--cyan),var(--pink))}
.t80 .banner.on{background:linear-gradient(90deg,#ff2bd6,#ff5e7e 40%,#ff8a3d 60%,#ff2bd6);background-size:200% 100%;animation:roll80 1.4s linear infinite}
@keyframes roll80{to{background-position:-200% 0}}
.t80 .banner.on .txt{color:#fff;text-shadow:0 0 10px rgba(18,5,43,.9),3px 3px 0 #12052b}
.t80 .who{background:var(--pink);box-shadow:0 0 14px var(--pink)}
/* zone jeu : fines lignes néon */
.t80 .game{border-top:4px solid var(--cyan);border-bottom:4px solid var(--pink);box-shadow:0 -6px 22px rgba(45,226,255,.45),0 6px 22px rgba(255,43,214,.45)}
.t80 .game::before,.t80 .game::after{background:linear-gradient(90deg,var(--pink),var(--sun3));box-shadow:0 0 14px var(--pink)}
/* décor du bas : coucher de soleil rétro, soleil rayé, sol quadrillé, palmiers */
.scene{position:absolute;left:0;top:1586px;width:1080px;height:334px;display:none;overflow:hidden;pointer-events:none}
.t80 .scene{display:block}
.scene .sky{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,5,43,0) 0%,rgba(43,10,80,.85) 25%,#5a1580 55%,#b0247f 78%,#ff5e7e 100%)}
.scene .sun{display:block;left:50%;top:10px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
  background:linear-gradient(180deg,var(--sun1),var(--sun3) 55%,var(--pink));
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);
  box-shadow:0 0 60px rgba(255,138,61,.8);filter:drop-shadow(0 0 30px rgba(255,94,126,.8))}
.scene .grid{position:absolute;left:-40%;right:-40%;bottom:-10px;height:200px;transform:perspective(260px) rotateX(62deg);transform-origin:bottom;
  background:linear-gradient(transparent 0 95%,rgba(45,226,255,.9) 95%) 0 0/100% 34px,linear-gradient(90deg,transparent 0 96%,rgba(255,43,214,.9) 96%) 0 0/54px 100%;
  animation:grid80 1.6s linear infinite;opacity:.85}
@keyframes grid80{to{background-position:0 34px,0 0}}
.scene .palm{display:block;bottom:-6px;width:260px;height:380px}
.scene .palm.l{left:-70px}.scene .palm.r{right:-70px}
/* menu des défis : verre sombre + néon */
.t80 .menu{background:linear-gradient(170deg,rgba(43,10,80,.82),rgba(18,5,43,.86));border:3px solid var(--pink);box-shadow:0 0 26px rgba(255,43,214,.6),7px 7px 0 rgba(45,226,255,.75);backdrop-filter:blur(4px)}
.t80 .menu h2{font-size:40px}
.t80 .menu h2 em{color:inherit}
.t80 .coin{color:var(--sun1)}
.t80 .coin i{background:radial-gradient(circle at 35% 30%,#fff7c2,var(--sun1) 45%,var(--sun3));box-shadow:0 0 10px rgba(255,138,61,.9)}
.t80 .row.lit{background:linear-gradient(90deg,var(--pink),var(--sun3));box-shadow:0 0 20px rgba(255,43,214,.8)}
.t80 .pola{background:#1a0a33;box-shadow:0 0 0 3px var(--cyan),0 0 26px rgba(45,226,255,.6),0 0 0 7px rgba(255,43,214,.7),10px 10px 0 rgba(0,0,0,.4)}
.t80 .pola::before{background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,var(--cyan) 10px 20px)}
.t80 .pola p{color:#fff;text-shadow:0 0 10px var(--pink)}
.t80 .pola small{color:var(--cyan)}
.t80 .toast{border-color:var(--pink);background:rgba(18,5,43,.9);box-shadow:0 0 18px rgba(255,43,214,.7)}
.t80 .toast b{color:var(--sun1)}
.t80 .big .t2{background:linear-gradient(90deg,var(--pink),var(--sun3));color:#fff;text-shadow:2px 2px 0 rgba(18,5,43,.6);box-shadow:0 0 30px rgba(255,43,214,.9),6px 6px 0 var(--cyan)}

/* menu des défis sur 2 colonnes (zone jeu en 4:3) */
#rows{display:grid;grid-template-columns:1fr 1fr;column-gap:8px;row-gap:2px}
.row + .row{margin-top:0}
.row{padding:3px 8px;gap:8px}
.coin{flex:0 0 78px;font-size:21px;gap:6px}
.coin i{width:20px;height:20px}
.row span{font-size:19px}
.menu h2{font-size:32px !important;margin-bottom:6px}

/* cadres néon pour les zooms Fortnite (carte + armes) : place tes captures recadrées dessous. ?zooms=0 pour les cacher */
.zoom{position:absolute;box-sizing:border-box;border-radius:16px;pointer-events:none}
.zoom::before{content:"";position:absolute;inset:0;border-radius:16px;padding:5px;background:linear-gradient(135deg,var(--pink,#ff2bd6),var(--violet,#9b4dff) 50%,var(--cyan,#2de2ff));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.zoom{box-shadow:0 0 18px rgba(255,43,214,.6),0 0 14px rgba(45,226,255,.45) inset}
.zoom b{position:absolute;top:-18px;left:14px;font-family:var(--display);font-weight:400;font-size:20px;line-height:1;padding:5px 10px;border-radius:8px;
  color:#12052b;background:linear-gradient(90deg,var(--cyan,#2de2ff),var(--pink,#ff2bd6));box-shadow:0 0 12px rgba(255,43,214,.7)}
.zoom.map{left:822px;top:742px;width:236px;height:236px}
.zoom.arm{left:640px;top:1452px;width:418px;height:112px}
.zoom.vie{left:22px;top:1452px;width:380px;height:112px}
.nozoom .zoom{display:none}
.guide .zoom{background:rgba(255,255,255,.08)}
</style>
</head>
<body>

      var b = (k - .86) / .14; return [cx0 + rx + (1400 - cx0 - rx) * b, cy0 + (760 - cy0) * b];
    }

    (function step(now) {
      var k = Math.min(1, (now - t0) / dur), p = pos(k), q = pos(Math.min(1, k + .01));
      var head = Math.atan2(q[1] - p[1], q[0] - p[0]);
      var drift = (k > .14 && k < .86) ? .65 : (k <= .14 ? .65 * (k / .14) : .65 * (1 - (k - .86) / .14));

      d.car.position.set(p[0], -p[1], 0); d.car.rotation.z = -ang;
      d.body.rotation.y = Math.sin(now / 70) * .03;              // la caisse vibre
      d.wheels.forEach(function (w) { w.rotation.y += .5; });
      d.r.render(d.sc, d.cam);
      var fx = Math.cos(ang), fy = Math.sin(ang);                // fumée des pneus arrière + flammes du pot
      if (lastP && Math.random() < .5) {
        smoke(p[0] - fx * 150 - fy * 95, p[1] - fy * 150 + fx * 95, 1, { vx: -fx * 1.5, vy: -fy * 1.5 - .4, s: .8, c: 215 });
        smoke(p[0] - fx * 150 + fy * 95, p[1] - fy * 150 - fx * 95, 1, { vx: -fx * 1.5, vy: -fy * 1.5 - .4, s: .8, c: 215 });
      }
      if (lastP && Math.random() < .6) {
        flame(p[0] + fx * 130, p[1] + fy * 130 - 100);
      }
      lastP = p;
      if (k < 1) requestAnimationFrame(step);
      else { d.busy = false; d.r.clear(); d.cv.style.display = 'none'; boom(1000, 760, 1.2); shake(); }
    })(t0);
  }
  function playReel(next) {
    var v = $('reel'), done = false;
    function end() { if (done) return; done = true; v.pause(); v.style.display = 'none'; boom(540, 1050, 1.3); shake(); if (next) next(); }
    try { v.currentTime = 0; v.style.display = 'block'; var pr = v.play(); if (pr && pr.catch) pr.catch(end); } catch (e) { return end(); }
    v.onended = end; setTimeout(end, 4300);
  }
  function bigText(user, d) {
    var b = $('big'); $('bigt1').textContent = 'MERCI ' + user + ' !'; $('bigt2').textContent = d.txt;
    shrink($('bigt1'), 1000, 92);
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  }

  /* ---------- Toasts ---------- */
  function toast(html) {
    var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; $('toasts').appendChild(t);
    while ($('toasts').children.length > 3) $('toasts').removeChild($('toasts').firstChild);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 420); }, 4200);
  }

  /* ---------- Bandeau : idle (défile le menu) / défi en cours ---------- */
  var queue = [], cur = null, curEnd = 0, curStart = 0, idleI = 0;
  var IDLE = ['🎁 TES CADEAUX = MES DÉFIS'].concat(DEFIS.map(function (d) { return d.min + '+ PIÈCES → ' + d.txt; }), ['OBJECTIF : TOP 1 FORTNITE 👑', 'ABONNE-TOI → @wald.off 🔔']);
  function setTxt(s) { var t = $('btxt'); t.textContent = s; shrink(t, cur ? 700 : 940, 38); t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap'); }
  function idle() { if (!cur) { setTxt(IDLE[idleI++ % IDLE.length]); } }
  setInterval(idle, 4500);
  function lit(i) { DEFIS.forEach(function (d, j) { $('row' + j).classList.toggle('lit', j === i); }); }
  function start(item) {
    cur = item; var d = DEFIS[item.tier]; curStart = Date.now();
    var len = d.sec || d.max || 120; curEnd = curStart + len * 1000;
    $('banner').classList.add('on'); $('cam').classList.add('hot');
    setTxt('⚠ ' + d.txt);
    $('who').textContent = 'offert par ' + item.user + (item.gift ? ' · ' + item.gift : ''); $('who').classList.add('on');
    lit(item.tier); updQ();
    if (d.reel) { voix('sons/polo.mp3'); playReel(function () { bigText(item.user, d); }); }
    else if (d.drift) { poloDrift(); bigText(item.user, d); }
    else if (d.big) { poloRun(d.big); bigText(item.user, d); SFX.boom(); SFX.moteur(); } else { boom(540, 692, .9); SFX.defi(); }
    if (d.voix) voix(d.voix);
  }
  function stop() {
    cur = null; $('banner').classList.remove('on'); $('cam').classList.remove('hot'); $('who').classList.remove('on');
    $('bbar').style.width = '0'; lit(-1);
    if (queue.length) setTimeout(function () { start(queue.shift()); }, 600); else { idleI = 0; idle(); }
    updQ();
  }
  function updQ() { var e = $('bq'); e.textContent = queue.length ? '+' + queue.length + ' en attente' : ''; e.classList.toggle('has', !!queue.length); }
  setInterval(function () {
    if (!cur) return; var d = DEFIS[cur.tier], now = Date.now(), left = Math.max(0, curEnd - now);
    if (d.sec) { var s = Math.ceil(left / 1000); $('btm').textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); $('bbar').style.width = (100 * (1 - left / (curEnd - curStart))) + '%'; }
    else $('btm').textContent = d.tag || 'KILL';
    if (left <= 0) stop();
  }, 250);

  function flashRow(i) { var r = $('row' + i); r.classList.add('lit'); setTimeout(function () { if (!cur || cur.tier !== i) r.classList.remove('lit'); }, 4000); }
  function superFan(user) {
    toast('⭐ <b>' + esc(user) + '</b> devient SUPER FAN → JE CRIE « WALD OFF ! »');
    var b = $('big'); $('bigt1').textContent = 'NOUVEAU SUPER FAN !'; $('bigt2').textContent = user + ' → JE CRIE « WALD OFF ! »';
    shrink($('bigt1'), 1000, 92); b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    boom(300, 900, 1.3); boom(780, 900, 1.3); shake(); SFX.klaxon(); setTimeout(function () { voix(VOIX_SUPERFAN); }, 600);
  }
  function tierFor(coins) { var t = 0; DEFIS.forEach(function (d, i) { if (coins >= d.min) t = i; }); return t; }
  function gift(user, giftName, coins, count) {
    var tier = tierFor(coins), d = DEFIS[tier];
    toast('🎁 <b>' + esc(user) + '</b> · ' + esc(giftName || 'cadeau') + (count > 1 ? ' ×' + count : '') + ' → ' + esc(d.txt));
    var item = { tier: tier, user: user, gift: (giftName || '') + (count > 1 ? ' ×' + count : '') };
    if (d.quick) { flashRow(tier); boom(rnd(250, 830), 692, .6); if (d.voix) voix(d.voix); else SFX.coin(); return; }   // petits cadeaux : juste le message, pas de bandeau
    if (!cur) start(item); else { queue.push(item); updQ(); boom(rnd(200, 880), 692, .5); }
  }
  function command(txt) {
    var c = txt.trim().toLowerCase();
    if (c === '!top1' || c === '!top1+') setTop(top1 + 1, true);
    else if (c === '!top1-') setTop(top1 - 1);
    else if (c === '!reset') setTop(0);
    else if (c === '!ok' || c === '!next' || c === '!fini') { if (cur) stop(); }
  }
  window.WALD = { gift: gift, command: command, top1: function () { setTop(top1 + 1, true); }, superFan: function (u) { superFan(u || '@super_pote'); } };

  /* ---------- Télécommande (téléphone) : ?t=NOM_SECRET dans l'adresse, messages via ntfy.sh ---------- */
  var TOPIC = q.get('t');
  function remote(msg) {
    msg = String(msg || '').trim().toLowerCase();
    if (msg === 'top1') setTop(top1 + 1, true);
    else if (msg === 'top1-') setTop(top1 - 1);
    else if (msg === 'reset') setTop(0);
    else if (msg === 'ok') { if (cur) stop(); }
    else if (msg === 'superfan') superFan('@test');
    else if (msg.indexOf('gift:') === 0) { var n = parseInt(msg.slice(5), 10) || 1; gift('@test', 'Cadeau test', n, 1); }
  }
  function listenRemote() {
    if (!TOPIC || !window.EventSource) return;
    var es = new EventSource('https://ntfy.sh/' + encodeURIComponent(TOPIC) + '/sse');
    es.onmessage = function (e) { try { var m = JSON.parse(e.data); if (m.event === 'message') remote(m.message); } catch (x) {} };
    es.onerror = function () { dbg('télécommande : reconnexion…'); };
  }
  listenRemote();

  /* ---------- Connexion TikFinity (appli Windows, Event API) ---------- */
  var WS = q.get('ws') || 'ws://localhost:21213/', seen = {};
  function dbg(s) { $('dbg').textContent = s; }
  function connect() {
    var ws; try { ws = new WebSocket(WS); } catch (e) { dbg('ws erreur'); return setTimeout(connect, 4000); }
    ws.onopen = function () { dbg('TikFinity connecté'); };

      var msg; try { msg = JSON.parse(m.data); } catch (e) { return; }

      if (ev === 'gift') {
        if (d.giftType === 1 && d.repeatEnd === false) return;          // combo pas fini : on attend la fin
        var key = (d.msgId || '') + user + d.giftId + d.repeatCount; if (seen[key]) return; seen[key] = 1;
        var n = Math.max(1, d.repeatCount || 1), coins = (d.diamondCount || d.diamonds || 1) * n;

      } else if (ev === 'subscribe' || ev === 'superfan' || ev === 'member_subscribe') {
        superFan(user);
      } else if (ev === 'chat' && d.comment) {
        var u = String(d.uniqueId || (d.user && d.user.uniqueId) || '').toLowerCase();
        if (u === HOST || d.isModerator) command(d.comment);
      }
    };
  }
  connect();

  /* ---------- Démo / test : ?demo  ou touches 1-6, T, N ---------- */
  var DEMO = DEFIS.map(function (d, i) { return ['@pote_' + (i + 1), 'Cadeau', d.min, 1]; });
  if (q.has('demo')) { var di = 0; setTimeout(function run() { var x = DEMO[di++ % DEMO.length]; gift(x[0], x[1], x[2], x[3]); setTimeout(function () { if (cur) stop(); }, 5200); setTimeout(run, 7000); }, 900); setInterval(function () { setTop(top1 + 1, true); }, 21000); }
  addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k >= '1' && k <= '8') { var x = DEMO[+k - 1]; gift(x[0], x[1], x[2], x[3]); }
    else if (k === 's') superFan('@super_pote');
    else if (k === 't') setTop(top1 + 1, true); else if (k === 'n' && cur) stop();
  });
  idle();
})();
