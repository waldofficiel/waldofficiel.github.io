name: Construire Wald Royal (Android + PC)
on:
  push:
    branches: [main]
    paths: ['jeu/**', 'app/**', '.github/workflows/jeu.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-jeu
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms | tail -3
          echo "sdk.dir=$ANDROID_HOME" > app/android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copier le jeu dans l'APK
        run: |
          mkdir -p app/android/app/src/main/assets
          cp -r jeu/. app/android/app/src/main/assets/
          rm -f app/android/app/src/main/assets/sw.js app/android/app/src/main/assets/perso.jpg app/android/app/src/main/assets/polo_drift.webp
      - name: Construire l'APK
        working-directory: app/android
        run: gradle assembleRelease --no-daemon
      - run: cp app/android/app/build/outputs/apk/release/app-release.apk WaldRoyal.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: WaldRoyal.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Copier le jeu
        shell: bash
        run: |
          mkdir -p app/desktop/game
          cp -r jeu/. app/desktop/game/
          rm -f app/desktop/game/sw.js app/desktop/game/perso.jpg app/desktop/game/polo_drift.webp
      - name: Construire l'installeur Windows
        working-directory: app/desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: app/desktop/dist/WaldRoyal-Setup.exe }
  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jeu
          name: Wald Royal
          body: "Wald Royal, le battle royale de Wald Off. Android : WaldRoyal.apk · PC Windows : WaldRoyal-Setup.exe"
          make_latest: true
          files: |
            out/WaldRoyal.apk
            out/WaldRoyal-Setup.exe
