name: Construire Wald Game (Android + PC)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/jeu.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-jeu
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 app/manifest.py
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms | tail -3
          echo "sdk.dir=$ANDROID_HOME" > app/android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Construire l'APK
        working-directory: app/android
        run: gradle assembleRelease --no-daemon
      - run: cp app/android/app/build/outputs/apk/release/app-release.apk WaldGame.apk && cp WaldGame.apk WaldRoyal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            WaldGame.apk
            WaldRoyal.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python app/manifest.py
        shell: bash
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Construire l'installeur Windows
        working-directory: app/desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: app/desktop/dist/WaldGame-Setup.exe }
  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cp out/WaldGame-Setup.exe out/WaldRoyal-Setup.exe && ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jeu
          name: Wald Game
          body: "Wald Game, le launcher de Wald Royal. Android : WaldGame.apk · PC Windows : WaldGame-Setup.exe"
          make_latest: true
          files: |
            out/WaldGame.apk
            out/WaldGame-Setup.exe
            out/WaldRoyal.apk
            out/WaldRoyal-Setup.exe
